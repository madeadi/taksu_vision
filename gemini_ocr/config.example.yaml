# Copy to config.yaml and fill in. Every field is optional — anything left
# unset (or the whole file missing) falls back to its env var, then to a
# hardcoded default. See README.md's Configuration section.
#
# config.yaml is gitignored, but gemini_api_key is still a secret — never
# commit a filled-in copy of this file.

gemini_api_key: ""
gemini_model: gemini-2.5-flash-lite
max_concurrency: 4
workspace_root: /path/to/shared/storage
save_results_dir: gemini_ocr/output.json
