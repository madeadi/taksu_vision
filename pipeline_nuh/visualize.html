<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>image_crops box visualizer</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: #1e1e1e;
    color: #eee;
  }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    margin-bottom: 12px;
    padding: 12px;
    background: #2a2a2a;
    border-radius: 8px;
  }
  .controls label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .controls input[type="file"] { font-size: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
  #status { font-size: 12px; color: #999; margin-bottom: 10px; }
  #canvasWrap { overflow: auto; border: 1px solid #444; border-radius: 6px; max-height: 85vh; }
  canvas { display: block; }
  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 4px;
    display: none;
    white-space: pre;
    z-index: 10;
  }
</style>
</head>
<body>

<h1>image_crops box visualizer</h1>

<div class="controls">
  <label>Image
    <input type="file" id="imageInput" accept="image/*">
  </label>
  <label>output.json
    <input type="file" id="jsonInput" accept="application/json,.json">
  </label>
  <label><input type="checkbox" id="showXyxy" checked> xyxy</label>
  <label><input type="checkbox" id="showPolygon" checked> polygon</label>
  <label><input type="checkbox" id="showLabels" checked> labels</label>
  <div class="legend">
    <span><span class="swatch" style="background:#00e676"></span>xyxy (axis-aligned envelope)</span>
    <span><span class="swatch" style="background:#ff5252"></span>polygon (oriented box)</span>
  </div>
</div>

<div id="status">Load an image and its matching output.json to begin.</div>
<div id="canvasWrap"><canvas id="canvas"></canvas></div>
<div id="tooltip"></div>

<script>
const imageInput = document.getElementById('imageInput');
const jsonInput = document.getElementById('jsonInput');
const showXyxy = document.getElementById('showXyxy');
const showPolygon = document.getElementById('showPolygon');
const showLabels = document.getElementById('showLabels');
const status = document.getElementById('status');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let loadedImage = null;
let loadedData = null;
let boxRegions = []; // {x1,y1,x2,y2,box}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

imageInput.addEventListener('change', async () => {
  const file = imageInput.files[0];
  if (!file) return;
  const dataUrl = await readFileAsDataURL(file);
  const img = new Image();
  img.onload = () => { loadedImage = img; draw(); };
  img.src = dataUrl;
});

jsonInput.addEventListener('change', async () => {
  const file = jsonInput.files[0];
  if (!file) return;
  try {
    const text = await readFileAsText(file);
    loadedData = JSON.parse(text);
    draw();
  } catch (err) {
    status.textContent = 'Failed to parse JSON: ' + err.message;
  }
});

[showXyxy, showPolygon, showLabels].forEach(el => el.addEventListener('change', draw));

function draw() {
  if (!loadedImage) {
    status.textContent = 'Load an image and its matching output.json to begin.';
    return;
  }

  canvas.width = loadedImage.naturalWidth;
  canvas.height = loadedImage.naturalHeight;
  ctx.drawImage(loadedImage, 0, 0);
  boxRegions = [];

  if (!loadedData) {
    status.textContent = `Image loaded (${canvas.width}x${canvas.height}). Now load output.json.`;
    return;
  }

  const boxes = (loadedData.output && loadedData.output.boxes) || [];
  const input = loadedData.input || {};

  ctx.lineWidth = Math.max(2, Math.round(canvas.width / 700));
  ctx.font = `${Math.max(14, Math.round(canvas.width / 120))}px sans-serif`;
  ctx.textBaseline = 'bottom';

  boxes.forEach(box => {
    if (showXyxy.checked && box.xyxy) {
      const [x1, y1, x2, y2] = box.xyxy;
      ctx.strokeStyle = '#00e676';
      ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    }

    if (showPolygon.checked && box.polygon) {
      ctx.strokeStyle = '#ff5252';
      ctx.beginPath();
      box.polygon.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
      ctx.closePath();
      ctx.stroke();
    }

    if (showLabels.checked && box.xyxy) {
      const [x1, y1] = box.xyxy;
      const label = `#${box.box_index} conf=${box.yolo_conf}`;
      const metrics = ctx.measureText(label);
      const padding = 3;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(x1, y1 - 18 - padding * 2, metrics.width + padding * 2, 18 + padding * 2);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, x1 + padding, y1 - padding);
    }

    if (box.xyxy) {
      const [x1, y1, x2, y2] = box.xyxy;
      boxRegions.push({ x1, y1, x2, y2, box });
    }
  });

  status.textContent =
    `${input.image_name || ''} — ${boxes.length} boxes` +
    (loadedData.output && loadedData.output.n_blurry ? `, ${loadedData.output.n_blurry} blurry-skipped` : '') +
    ` — image ${canvas.width}x${canvas.height}`;
}

canvas.addEventListener('mousemove', (event) => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (event.clientX - rect.left) * scaleX;
  const y = (event.clientY - rect.top) * scaleY;

  const hit = boxRegions.find(r => x >= r.x1 && x <= r.x2 && y >= r.y1 && y <= r.y2);
  if (hit) {
    const b = hit.box;
    tooltip.style.display = 'block';
    tooltip.style.left = (event.clientX + 14) + 'px';
    tooltip.style.top = (event.clientY + 14) + 'px';
    tooltip.textContent =
      `box_index: ${b.box_index}\n` +
      `yolo_conf: ${b.yolo_conf}\n` +
      `is_obb: ${b.is_obb}\n` +
      `layout_angle: ${b.layout_angle}\n` +
      `layout_margin: ${b.layout_margin}\n` +
      `xyxy: [${(b.xyxy || []).join(', ')}]\n` +
      `image: ${b.image_name}`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
</script>

</body>
</html>
